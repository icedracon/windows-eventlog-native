[package]
name = "windows-eventlog-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "Native EvtQuery/EvtNext/EvtRender wrapper for local Windows Event Log channels (Security/System/Application) with parsed EventData. Built on win32-min (hand-rolled FFI, no windows-rs)."
repository = "https://github.com/icedracon/windows-eventlog-native"
documentation = "https://docs.rs/windows-eventlog-native"
readme = "README.md"
keywords = ["windows", "eventlog", "wevtapi", "evtquery", "security"]
categories = ["os::windows-apis", "parser-implementations", "api-bindings"]

[dependencies]
quick-xml = "0.36"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
win32-min = { version = "0.1", features = ["eventlog"] }

[target.'cfg(not(windows))'.dependencies]

[lib]
name = "windows_eventlog_native"
path = "src/lib.rs"
