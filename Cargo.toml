[package]
name = "windows-eventlog-native"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["zevs"]
description = "Native Windows Event Log querying and structured XML parsing for DFIR, detection engineering, and security research."
repository = "https://github.com/icedracon/windows-eventlog-native"
documentation = "https://docs.rs/windows-eventlog-native"
readme = "README.md"
keywords = ["windows", "eventlog", "dfir", "forensics", "security"]
categories = ["os::windows-apis", "parser-implementations", "api-bindings"]

[dependencies]
quick-xml = "0.36"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
win32-min = { version = "0.1.2", features = ["eventlog"] }

[target.'cfg(not(windows))'.dependencies]

[lib]
name = "windows_eventlog_native"
path = "src/lib.rs"
