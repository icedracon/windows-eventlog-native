[package]
name = "windows-eventlog-native"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "Native EvtQuery/EvtNext/EvtRender wrapper for local Windows Event Log channels (Security/System/Application) with parsed EventData. Pre-alpha"
repository = "https://github.com/icedracon/windows-eventlog-native"
documentation = "https://docs.rs/windows-eventlog-native"
readme = "README.md"
keywords = ["windows", "eventlog", "wevtapi", "evtquery", "security"]
categories = ["os::windows-apis", "parser-implementations", "api-bindings"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_System_EventLog",
    "Win32_Foundation",
] }
windows-core = "0.61"
quick-xml = "0.36"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"

[target.'cfg(not(windows))'.dependencies]

[lib]
name = "windows_eventlog_native"
path = "src/lib.rs"
